# The background jobs that are NOT time-critical, OFF Vercel — see
# scripts/run-cron.mjs.
#
# v36.2 — THE VISIT / NEXT-STEP / CALL-BACK REMINDERS LEFT THIS FILE. GitHub's
# scheduler ran the "every 30 min" schedule 5 times in 24 hours (10 runs in
# all, the other 5 being sheet exports cancelled at the 10-min limit), so
# reminders arrived hours late. They now run from Supabase pg_cron every 15
# min, 07:00–midnight Cairo, and only call Vercel when
# `visit_followups_due()` says something is due (supabase/cron.sql). What
# stays here tolerates GitHub's timing:
#
#   ir-bounces      every 30 min, working hours — flags IR invites that bounced
#   sheets-export   hourly at :05, working hours
#
# ⚠️ Never schedule `visit-followups` here again: two schedulers racing over
# the same due rows is how a member gets a reminder twice. It stays a MANUAL
# option below, for "run it all now".
#
# BUDGET NOTE — this repo is PRIVATE, so Actions minutes are capped (2,000/mo
# on the free plan) and are a real budget, not a free lunch. The sheet-import
# workflow already measures ~51s per run and ~780 min/month.

name: Background jobs

on:
  schedule:
    # bounce scan every 30 min, sheet export at :05 — working hours only
    # (04:00–21:59 UTC ≈ 06:00–00:00 Cairo)
    - cron: "*/30 4-21 * * *"
    - cron: "5 4-21 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: ir-bounces
        type: choice
        options: [ir-bounces, sheets-export, visit-followups]

concurrency:
  group: background-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ ships a global WebSocket — @supabase/supabase-js needs one and
          # throws at createClient() on Node 20 (v33.19.2)
          node-version: 22
          cache: npm
      # tsx is already in devDependencies, so npm ci installs it — no extra
      # install step needed here (the imports workflow had a redundant one).
      - run: npm ci --no-audit --no-fund

      - name: IR bounce scan
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '*/30 4-21 * * *') ||
          github.event.inputs.job == 'ir-bounces'
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/run-cron.mjs ir-bounces

      - name: Sheets export
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '5 4-21 * * *') ||
          github.event.inputs.job == 'sheets-export'
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/run-cron.mjs sheets-export

      - name: Visit follow-ups (manual only)
        if: github.event.inputs.job == 'visit-followups'
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/run-cron.mjs visit-followups
